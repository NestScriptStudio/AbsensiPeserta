<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi QR Code Siswa</title>
    <!-- Memuat Pustaka Pemindai QR Code (html5-qrcode) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f5; /* Background belakang abu-abu */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar Hijau Tosca */
        nav {
            background-color: #14B8A6;
            color: white;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 100%;
        }

        /* Bingkai Logo & Teks di Kiri Navbar */
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-container {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4px;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .navbar-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Container Utama */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Kartu Kolom Absensi Warna Putih */
        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
            font-size: 14px;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            background-color: #fafafa;
            transition: all 0.3s ease;
        }

        select:focus, input:focus {
            border-color: #00897b;
            background-color: #fff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 137, 123, 0.15);
        }

        /* Tombol Scan QR Code Warna Oranye */
        button {
            width: 100%;
            padding: 14px;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.3);
        }
        button:hover {
            background-color: #f57c00;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background-color: #e0e0e0;
            color: #9e9e9e;
            cursor: not-allowed;
            box-shadow: none;
        }

        #reader {
            width: 100%;
            margin-top: 15px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px dashed #00897b;
        }

        /* Animasi Transisi Halus Saat Pergantian Halaman/Bagian */
        .fade-transition {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hidden {
            display: none !important;
        }

        .alert {
            padding: 14px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            margin-top: 15px;
            font-size: 14px;
        }
        .alert-success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }
        .alert-error {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        /* Footer Hijau Tosca Berisi Teks */
        footer {
            background-color: #14B8A6;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 13px;
            letter-spacing: 0.3px;
            width: 100%;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
        }

/* Responsif untuk HP / Layar Kecil */
@media (max-width: 480px) {
    body {
        padding: 0;
        /* Memastikan body minimal setinggi layar penuh */
        min-height: 100vh; 
    }
    .card {
        padding: 18px;
        border-radius: 0;
        box-shadow: none;
        /* Hapus min-height yang kaku agar kartu menyesuaikan isi konten secara fleksibel */
        min-height: auto; 
        display: block; /* Kembalikan ke block biasa agar konten mengalir normal */
    }
    .main-container {
        padding: 10px;
        align-items: flex-start; /* Ubah agar konten dimulai dari atas, tidak menumpuk di tengah secara kaku */
    }
            nav {
                padding: 10px 15px;
            }
            .navbar-title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar Hijau Tosca dengan Bingkai Logo & Teks -->
    <nav>
        <div class="navbar-brand">
            <div class="logo-container">
                <!-- Ganti 'logo.png' dengan file gambar logo Anda -->
                <img src="logo akl rb.png" alt="Logo" onerror="this.style.display='none'">
            </div>
            <span class="navbar-title">Accounting</span>
        </div>
    </nav>

    <!-- Container Utama -->
    <div class="main-container">
        <div class="card">
            <h2>Absensi Siswa</h2>
            
            <!-- Pesan Status Sesi (Jika Ditutup) -->
            <div id="sesiTutupAlert" class="alert alert-error hidden fade-transition">
                Sesi telah berakhir atau ditutup oleh guru.
            </div>

            <!-- Form Identitas Siswa -->
            <div id="formIdentitas" class="fade-transition">
                <div class="form-group">
                    <label for="selectKelas">Pilih Kelas</label>
                    <select id="selectKelas" onchange="filterNama()">
                        <option value="">-- Memuat Kelas... --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="selectNama">Pilih Nama Siswa</label>
                    <select id="selectNama" disabled>
                        <option value="">-- Pilih Kelas Terlebih Dahulu --</option>
                    </select>
                </div>

                <button id="btnMulaiScan" onclick="siapScan()" disabled>Lanjut Scan QR Code</button>
            </div>

            <!-- Area Pemindai Kamera -->
            <div id="areaScan" class="hidden fade-transition">
                <p style="text-align: center; font-size: 14px; color: #666; margin-top: 0;">Arahkan kamera ke QR Code di papan pengumuman</p>
                <div id="reader"></div>
                <button onclick="batalScan()" style="background-color: #78909c; margin-top: 15px; box-shadow: 0 4px 10px rgba(120, 144, 156, 0.3);">Kembali / Batal</button>
            </div>

            <!-- Notifikasi Hasil -->
            <div id="hasilNotif" class="fade-transition"></div>
        </div>
    </div>

    <!-- Footer Hijau Tosca Berisi Teks -->
    <footer>
        &copy;  2026 NestScript Studio. All Rights Reserved
    </footer>

    <script>
        // --- MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI ---
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwZ3JUJ7C1d77Tb4E0I9zWr2LxWe4AEPxmxC8ONR8dhxJf4rSiQ1660NowDdeUvV6NFdw/exec";

        let globalDataSiswa = [];
        let html5QrCode = null;

        // Ambil data awal dari Google Spreadsheet saat halaman dibuka
        window.onload = function() {
            fetch(WEB_APP_URL)
                .then(response => response.json())
                .then(data => {
                    if (data.statusSesi !== "BUKA") {
                        document.getElementById("formIdentitas").style.display = "none";
                        document.getElementById("sesiTutupAlert").classList.remove("hidden");
                        return;
                    }

                    globalDataSiswa = data.dataSiswa;
                    inisialisasiKelas();
                })
                .catch(error => {
                    alert("Gagal memuat data dari server. Periksa koneksi atau URL Web App.");
                    console.error(error);
                });
        };

        function inisialisasiKelas() {
            const selectKelas = document.getElementById("selectKelas");
            let kelasUnik = [...new Set(globalDataSiswa.map(item => item[0]))];
            
            selectKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>';
            kelasUnik.forEach(kelas => {
                let opt = document.createElement("option");
                opt.value = kelas;
                opt.textContent = kelas;
                selectKelas.appendChild(opt);
            });
        }

        function filterNama() {
            const kelasPilihan = document.getElementById("selectKelas").value;
            const selectNama = document.getElementById("selectNama");
            
            selectNama.innerHTML = '<option value="">-- Pilih Nama Siswa --</option>';
            
            if (kelasPilihan === "") {
                selectNama.disabled = true;
                document.getElementById("btnMulaiScan").disabled = true;
                return;
            }

            let siswaFiltered = globalDataSiswa.filter(item => item[0] === kelasPilihan);
            siswaFiltered.forEach(item => {
                let opt = document.createElement("option");
                opt.value = item[1];
                opt.textContent = item[1];
                selectNama.appendChild(opt);
            });

            selectNama.disabled = false;
            document.getElementById("btnMulaiScan").disabled = false;
        }

        function siapScan() {
            const kelas = document.getElementById("selectKelas").value;
            const nama = document.getElementById("selectNama").value;

            if (!kelas || !nama) {
                alert("Harap pilih Kelas dan Nama Anda terlebih dahulu!");
                return;
            }

            document.getElementById("formIdentitas").classList.add("hidden");
            document.getElementById("areaScan").classList.remove("hidden");

            // Mulai Kamera Pemindai QR
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess,
                onScanError
            ).catch(err => {
                alert("Gagal membuka kamera. Pastikan izin kamera diizinkan pada peramban Anda.");
                batalScan();
            });
        }

        function onScanSuccess(decodedText, decodedResult) {
            // Hentikan kamera setelah berhasil scan
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    kirimAbsen(decodedText);
                }).catch(err => console.error("Gagal menghentikan kamera", err));
            }
        }

        function onScanError(errorMessage) {
            // Error abaikan karena terjadi terus menerus saat mencari QR
        }

        function batalScan() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById("areaScan").classList.add("hidden");
                    document.getElementById("formIdentitas").classList.remove("hidden");
                });
            } else {
                document.getElementById("areaScan").classList.add("hidden");
                document.getElementById("formIdentitas").classList.remove("hidden");
            }
        }

        function kirimAbsen(kodeScan) {
            const kelas = document.getElementById("selectKelas").value;
            const nama = document.getElementById("selectNama").value;
            const notifDiv = document.getElementById("hasilNotif");

            notifDiv.innerHTML = "<p style='text-align:center;'>Sedang mengirim data...</p>";
            document.getElementById("areaScan").classList.add("hidden");

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({
                    kelas: kelas,
                    nama: nama,
                    kodeScan: kodeScan
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.result === "success") {
                    // Mainkan suara sukses sederhana via Web Audio API
                    playBeep();
                    notifDiv.innerHTML = `<div class="alert alert-success">✓ ${data.message} (${nama} - ${kelas})</div>`;
                } else {
                    notifDiv.innerHTML = `<div class="alert alert-error">✕ ${data.message}</div>`;
                }
            })
            .catch(err => {
                notifDiv.innerHTML = `<div class="alert alert-error">✕ Terjadi kesalahan koneksi ke server.</div>`;
            });
        }

        // Fungsi pemutar suara "beep" sukses
        function playBeep() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.value = 600;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
                osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) {
                // Abaikan jika browser memblokir audio otomatis
            }
        }
    </script>
</body>
</html>
